<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#ff6500" />
  <title>Mathside — Offline</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff9f4;color:#2f241d}body{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(520px,100%);background:#fff;border:1px solid #f0d9c9;border-radius:28px;padding:34px;box-shadow:0 22px 60px rgba(76,48,31,.12);text-align:center}.icon{width:74px;height:74px;margin:0 auto 18px;border-radius:22px;background:#ff6500;display:grid;place-items:center;color:white;font-size:34px;font-weight:900}h1{font-size:32px;margin:0 0 10px}p{margin:0 auto;color:#75675d;line-height:1.6;max-width:390px}.hint{font-size:13px;margin-top:10px}.actions{margin-top:24px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:0;border-radius:13px;background:#ff6500;color:#fff;font:800 15px system-ui;padding:12px 20px;cursor:pointer}.ghost{background:#fff;color:#2f241d;border:1px solid #ead8cb}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">∑</div>
    <h1>You’re offline</h1>
    <p>Mathside cannot reach the internet right now. Reconnect to continue using sign-in, classes, assignments, submissions, and other Supabase features.</p>
    <p class="hint">Some previously loaded interface files may still be available.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Try again</button>
      <button class="ghost" type="button" onclick="history.back()">Go back</button>
    </div>
  </main>
</body>
</html>
